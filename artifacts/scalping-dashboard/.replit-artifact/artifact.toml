kind = "web"
previewPath = "/"
title = "Meme Coin Scalping Dashboard"
version = "1.0.0"
id = "artifacts/scalping-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18432

[services.development]
run = "pnpm --filter @workspace/scalping-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/scalping-dashboard", "run", "build" ]
publicDir = "artifacts/scalping-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18432"
BASE_PATH = "/"
