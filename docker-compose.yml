services:
  api:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    restart: unless-stopped
    env_file: artifacts/api-server/.env
    ports:
      - "8080:8080"
    volumes:
      - scalping_data:/data
    environment:
      - SQLITE_PATH=/data/scalping.db
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  dashboard:
    build:
      context: .
      dockerfile: artifacts/scalping-dashboard/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  scalping_data:
